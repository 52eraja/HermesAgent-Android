name: Build Hermes Agent APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'APK version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Use gradle-action which provides Gradle automatically (no wrapper.jar needed)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Hermes Agent v${{ github.event.inputs.version }}
          body: |
            ## Hermes Agent Android v${{ github.event.inputs.version }}

            Auto-built by GitHub Actions 🤖

            ### 安装说明
            1. 下载 APK 到手机
            2. 设置 → 安全 → 允许安装未知来源应用
            3. 点击 APK 安装
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

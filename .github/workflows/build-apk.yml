name: Build Hermes Agent APK

on:
  # 手动触发（GitHub 网页上点按钮）
  workflow_dispatch:
    inputs:
      version:
        description: 'APK version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

  # 推送代码时自动构建
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

  # PR 时验证能否编译
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 缓存 Gradle 依赖（加速后续构建）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. 构建 APK
      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [ "${{ github.ref }}" = "refs/heads/release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      # 7. 上传 APK 作为构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # 8. （可选）发布到 GitHub Release
      - name: Create Release (debug)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Hermes Agent v${{ github.event.inputs.version }}
          body: |
            ## Hermes Agent Android v${{ github.event.inputs.version }}

            Auto-built by GitHub Actions 🤖

            ### 安装说明
            1. 下载 APK 到手机
            2. 设置 → 安全 → 允许安装未知来源应用
            3. 点击 APK 安装
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
